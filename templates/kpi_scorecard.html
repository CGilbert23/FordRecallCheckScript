<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EOS Scorecard - Fred Beans Mobile Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 1200px; margin: 60px auto; padding: 0 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 12px; text-align: center; }
        .subtitle { color: #666; margin-bottom: 20px; text-align: center; }
        .page-nav { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid #e5e7eb; justify-content: center; flex-wrap: wrap; }
        .nav-tab { padding: 10px 16px; color: #666; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: 0.9rem; font-weight: 500; }
        .nav-tab:hover { color: #0068d6; }
        .nav-tab.active { color: #0068d6; border-bottom-color: #0068d6; font-weight: 600; }
        .card { background: #fff; border-radius: 8px; padding: 20px 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        .empty-state { text-align: center; color: #888; padding: 48px 12px; line-height: 1.8; }
        .empty-state strong { color: #475569; display: block; font-size: 1rem; margin-bottom: 6px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fred Beans Mobile Service</h1>
        {% include '_nav.html' %}
        <p class="subtitle">EOS Scorecard for the mobile service team.</p>
        {% include '_kpi_tabs.html' %}

        <div class="card">
            <div class="empty-state">
                <strong>Nothing here yet.</strong>
                This tab is a placeholder &mdash; tell Claude what the scorecard should track and it gets built here.
            </div>
        </div>
    </div>
</body>
</html>
