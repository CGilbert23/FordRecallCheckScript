<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Notes - Fred Beans Mobile Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; display: flex; flex-direction: column; }
        .container { max-width: 1100px; width: 100%; margin: 40px auto 20px; padding: 0 20px; flex: 1; display: flex; flex-direction: column; }
        h1 { font-size: 1.8rem; margin-bottom: 12px; text-align: center; }
        .page-nav { display: flex; gap: 4px; margin-bottom: 12px; border-bottom: 2px solid #e5e7eb; justify-content: center; flex-wrap: wrap; }
        .nav-tab { padding: 10px 16px; color: #666; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: 0.9rem; font-weight: 500; }
        .nav-tab:hover { color: #0068d6; }
        .nav-tab.active { color: #0068d6; border-bottom-color: #0068d6; font-weight: 600; }
        .toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
        .toolbar .subtitle { color: #666; font-size: 0.95rem; }
        .status { margin-left: auto; font-size: 0.85rem; color: #6b7280; min-height: 1.2em; }
        .status.saving { color: #854d0e; }
        .status.saved { color: #166534; }
        .status.error { color: #b91c1c; }
        .card { background: #fff; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); flex: 1; display: flex; flex-direction: column; padding: 14px; min-height: 480px; }
        textarea {
            flex: 1; width: 100%; resize: none; border: none; outline: none;
            font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
            font-size: 0.95rem; line-height: 1.55; color: #222; background: transparent;
            padding: 6px;
        }
        .btn { display: inline-block; background: #0068d6; color: #fff; border: none; padding: 8px 16px; border-radius: 6px; font-size: 0.85rem; cursor: pointer; font-weight: 600; text-decoration: none; }
        .btn:hover { background: #0050a8; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fred Beans Mobile Service</h1>
        {% include '_nav.html' %}

        <form id="notes-form" method="post" action="/notes">
            <div class="toolbar">
                <div class="subtitle">Scratchpad — auto-saves a couple seconds after you stop typing.</div>
                <div id="status" class="status" aria-live="polite"></div>
                <button type="submit" class="btn" id="manual-save">Save</button>
            </div>
            <div class="card">
                <textarea id="notes-content" name="content" spellcheck="true" autofocus placeholder="Start typing&hellip;">{{ content }}</textarea>
            </div>
        </form>
    </div>

    <script>
        (function () {
            var textarea = document.getElementById('notes-content');
            var status = document.getElementById('status');
            var form = document.getElementById('notes-form');
            var lastSaved = textarea.value;
            var timer = null;
            var inFlight = false;
            var pending = false;

            function setStatus(text, cls) {
                status.textContent = text;
                status.className = 'status' + (cls ? ' ' + cls : '');
            }

            function save() {
                if (inFlight) { pending = true; return; }
                var content = textarea.value;
                if (content === lastSaved) { setStatus('Saved', 'saved'); return; }
                inFlight = true;
                setStatus('Saving…', 'saving');
                fetch('/notes', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ content: content }),
                }).then(function (r) {
                    if (!r.ok) throw new Error('HTTP ' + r.status);
                    return r.json();
                }).then(function () {
                    lastSaved = content;
                    setStatus('Saved', 'saved');
                }).catch(function (err) {
                    setStatus('Save failed — retrying', 'error');
                    setTimeout(save, 3000);
                }).finally(function () {
                    inFlight = false;
                    if (pending) { pending = false; save(); }
                });
            }

            textarea.addEventListener('input', function () {
                setStatus('Editing…');
                if (timer) clearTimeout(timer);
                timer = setTimeout(save, 1500);
            });

            // Manual Save button — POST via fetch instead of full page reload.
            form.addEventListener('submit', function (e) {
                e.preventDefault();
                if (timer) { clearTimeout(timer); timer = null; }
                save();
            });

            // Best-effort save on tab close. sendBeacon survives unload.
            window.addEventListener('beforeunload', function () {
                if (textarea.value === lastSaved) return;
                var blob = new Blob([JSON.stringify({ content: textarea.value })], { type: 'application/json' });
                navigator.sendBeacon('/notes', blob);
            });
        })();
    </script>
</body>
</html>
