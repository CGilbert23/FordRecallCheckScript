<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Key Notepad - Fred Beans Mobile Service</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; }
        .container { max-width: 1100px; margin: 60px auto; padding: 0 20px; }
        h1 { font-size: 1.8rem; margin-bottom: 12px; text-align: center; }
        .subtitle { color: #666; margin-bottom: 20px; text-align: center; }
        .page-nav { display: flex; gap: 4px; margin-bottom: 24px; border-bottom: 2px solid #e5e7eb; justify-content: center; flex-wrap: wrap; }
        .nav-tab { padding: 10px 16px; color: #666; text-decoration: none; border-bottom: 2px solid transparent; margin-bottom: -2px; font-size: 0.9rem; font-weight: 500; }
        .nav-tab:hover { color: #0068d6; }
        .nav-tab.active { color: #0068d6; border-bottom-color: #0068d6; font-weight: 600; }
        .card { background: #fff; border-radius: 8px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
        #notepad { width: 100%; min-height: 60vh; resize: vertical; border: 1px solid #e3e7ed; border-radius: 6px; padding: 14px 16px; font-size: 0.98rem; line-height: 1.55; font-family: inherit; color: #222; outline: none; }
        #notepad:focus { border-color: #0068d6; box-shadow: 0 0 0 3px rgba(0,104,214,0.12); }
        #notepad::placeholder { color: #b6bdc8; }
        .status { margin-top: 10px; font-size: 0.82rem; color: #888; text-align: right; }
        .status.error { color: #c0392b; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Fred Beans Mobile Service</h1>
        {% include '_nav.html' %}
        <p class="subtitle">Keys we couldn't do &mdash; note them here so they don't get reordered. Saves automatically as you type.</p>

        <div class="card">
            <textarea id="notepad" spellcheck="true" placeholder="e.g. 10/12 - 2019 Ford F-150 - 1FTEW1E5... - Smith - customer cancelled, don't reorder">{{ notepad.body or '' }}</textarea>
            <div id="status" class="status" data-updated-at="{{ notepad.updated_at or '' }}"></div>
        </div>
    </div>

    <script>
        (function () {
            var SAVE_DEBOUNCE_MS = 600;
            var box = document.getElementById('notepad');
            var status = document.getElementById('status');
            var timer = null;
            var dirty = false;
            var chain = Promise.resolve();

            function fmt(iso) {
                var d = new Date(iso);
                if (isNaN(d)) return '';
                return d.toLocaleString([], { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' });
            }

            function setStatus(text, isError) {
                status.textContent = text;
                status.classList.toggle('error', !!isError);
            }

            function save() {
                clearTimeout(timer);
                if (!dirty) return chain;
                dirty = false;
                var body = box.value;
                setStatus('Saving…');
                // Chain saves so an older request can't land after a newer one.
                chain = chain.then(function () {
                    return fetch('/mobile-keys/notepad/api/save', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ body: body }),
                    }).then(function (res) { return res.json(); }).then(function (data) {
                        if (!data.ok) throw new Error(data.error || 'save failed');
                        if (!dirty) setStatus('Saved ' + fmt(data.updated_at || new Date().toISOString()));
                    });
                }).catch(function (e) {
                    console.error('Notepad save failed:', e);
                    dirty = true;
                    setStatus('Save failed — will retry on your next edit', true);
                });
                return chain;
            }

            box.addEventListener('input', function () {
                dirty = true;
                setStatus('Unsaved changes…');
                clearTimeout(timer);
                timer = setTimeout(save, SAVE_DEBOUNCE_MS);
            });
            box.addEventListener('blur', save);

            // Leaving mid-debounce: flush with keepalive so the request outlives the page.
            window.addEventListener('pagehide', function () {
                if (!dirty) return;
                fetch('/mobile-keys/notepad/api/save', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ body: box.value }),
                    keepalive: true,
                });
            });

            var last = status.dataset.updatedAt;
            if (last) setStatus('Last saved ' + fmt(last));
        })();
    </script>
</body>
</html>
