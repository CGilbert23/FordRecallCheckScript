{# Performance Tracking sub-nav, in two rows. Included by every page in the
   section just under the subtitle. #}
{% set kpi_path = request.path %}
<div class="kpi-tabs">
    <div class="kpi-tab-row">
        <a href="/tech-performance/kpi-tracker/monthly-goals" class="kpi-tab {% if kpi_path.startswith('/tech-performance/kpi-tracker/monthly-goals') %}active{% endif %}">Monthly Goals</a>
        <a href="/tech-performance/kpi-tracker" class="kpi-tab {% if kpi_path == '/tech-performance/kpi-tracker' %}active{% endif %}">KPI Tracker</a>
        <a href="/tech-performance/kpi-tracker/scorecard" class="kpi-tab {% if kpi_path.startswith('/tech-performance/kpi-tracker/scorecard') %}active{% endif %}">EOS Scorecard</a>
    </div>
    <div class="kpi-tab-row">
        <a href="/tech-performance/kpi-tracker/profitability" class="kpi-tab {% if kpi_path.startswith('/tech-performance/kpi-tracker/profitability') %}active{% endif %}">Profitability</a>
        <a href="/tech-performance/xtime-report" class="kpi-tab {% if kpi_path.startswith('/tech-performance/xtime-report') %}active{% endif %}">Tech Report</a>
        <a href="/tech-performance/kpi-tracker/advisor-report" class="kpi-tab {% if kpi_path.startswith('/tech-performance/kpi-tracker/advisor-report') %}active{% endif %}">Advisor Report</a>
    </div>
</div>
<style>
    .kpi-tabs { display: flex; flex-direction: column; align-items: center; gap: 8px; margin-bottom: 22px; }
    .kpi-tab-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; }
    .kpi-tab { padding: 7px 18px; border: 1px solid #cbd5e1; border-radius: 999px; background: #fff; color: #475569; text-decoration: none; font-size: 0.85rem; font-weight: 600; min-width: 140px; text-align: center; }
    .kpi-tab:hover { background: #f1f5f9; color: #0f2a47; }
    .kpi-tab.active { background: #0f2a47; border-color: #0f2a47; color: #fff; }
    @media print { .kpi-tabs { display: none; } }
</style>
